<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 工作流工作台 · Demo</title>
<meta name="description" content="生产部补卡、行政统计报表、ERP 异常提示与接入验证的 AI 工作流演示（示例数据）">
<meta name="theme-color" content="#0F0F0F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230F0F0F'/%3E%3Cpath d='M9 29l7-16 5 10 4-8 6 14' fill='none' stroke='%23E1FD09' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="logo" aria-label="logo"><svg viewBox="0 0 40 40"><path d="M6 31l9-20 6 12 5-9 8 17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <nav class="nav" id="nav">
      <button data-p="ov" class="on"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M12 12l5-5"/></svg>总览</button>
      <button data-p="card"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>流程卡补制</button>
      <button data-p="rpt"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>统计报表</button>
      <button data-p="exc"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>异常提示</button>
      <button data-p="erp"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>ERP 接入</button>
    </nav>
    <div class="top-r">
      <button class="ib" title="搜索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button class="ib" title="刷新" id="refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
      <div class="avatar" title="生产部 · 文员">文</div>
    </div>
  </header>

  <div class="head">
    <h1 id="title">工作台</h1>
    <div class="subtabs" id="subtabs">
      <button class="on">全部</button><button>生产部</button><button>行政部</button><button>信息部</button>
    </div>
    <div class="head-r">
      <span class="chip">近 7 日 <span class="x">×</span></span>
      <span class="chip">信诺尔 ERP · 测试环境 <span class="x">×</span></span>
      <span class="chip warn"><span class="dot"></span>示例数据</span>
      <button class="ib white" title="筛选"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
    </div>
  </div>

  <main>
    <section class="page on" id="p-ov"></section>
    <section class="page" id="p-card"></section>
    <section class="page" id="p-rpt"></section>
    <section class="page" id="p-exc"></section>
    <section class="page" id="p-erp"></section>
  </main>

  <footer class="foot">
    <span>Demo · 所有数据均为虚构示例，不连接真实 ERP</span>
  </footer>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
