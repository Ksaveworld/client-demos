<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>研究写作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F1F6; --card:#F7F8FB; --card2:#FBFBFD; --line:#DADFE9; --line2:#E6E9F0;
  --gb:#C2CADD; --gb2:#A9B4CC; --gb3:#8796B5; --gb4:#6F7FA3; --gb0:#E3E7F0;
  --lemon:#FDF4A5; --lemon2:#F3E57A;
  --ink:#151821; --ink2:#2B3040; --mute:#7C8496; --mute2:#A3AAB9;
  --navy:#1C2541;
  --or:#E7812F; --or-bg:#FFF2E6; --rd:#E04B4F; --rd-bg:#FDEDED; --gr:#2E9F69; --gr-bg:#E6F5EE; --bl:#4D69A6; --bl-bg:#E8EDF8;
  --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
  --sans:Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.app{max-width:1480px;margin:0 auto;padding:14px 22px 96px}

/* header */
.top{display:flex;align-items:center;gap:14px;height:40px}
.logo{font-family:var(--sans);font-weight:500;font-size:20px;letter-spacing:.14em;display:flex;align-items:center}
.logo b{display:inline-block;width:11px;height:2px;background:var(--ink);margin:0 3px;position:relative;top:-1px}
.top .sp{flex:1}
.search{display:flex;align-items:center;background:#E7EAF2;border-radius:6px;padding:0 10px;width:320px;height:30px}
.search input{border:0;background:none;outline:none;flex:1;font-family:var(--mono);font-size:11px}
.ibtn{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;color:var(--ink2)}
.ibtn:hover{background:#E4E7EF}
.user{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;height:32px;padding:0 8px 0 4px;background:var(--card2);position:relative}
.user .av{width:24px;height:24px;border-radius:4px;background:var(--gb);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--navy)}
.user select{border:0;background:none;font-family:var(--mono);font-size:11px;outline:none;cursor:pointer;padding-right:4px}

/* summary */
.sum{display:flex;align-items:center;gap:10px;margin:14px 0 14px;flex-wrap:wrap}
.sum .lb{font-family:var(--mono);font-size:12px;letter-spacing:.02em}
.sum .lb b{font-weight:700;letter-spacing:.06em}
.py{background:var(--lemon);font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:3px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.sum .sp{flex:1}
.sqbtn{width:28px;height:28px;border:1px solid var(--line);border-radius:5px;display:grid;place-items:center;background:var(--card2)}

/* cards */
.grid{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;position:relative;min-width:0}
.ch{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-bottom:12px}
.ch .t{color:var(--ink2)}
.ch .sp{flex:1}
.ch .fid{background:var(--gb0);color:var(--gb4);padding:1px 5px;border-radius:3px;font-size:9.5px}
.ext{width:18px;height:18px;display:grid;place-items:center;color:var(--ink2)}
.seg{display:inline-flex;gap:2px;flex-wrap:wrap}
.seg button{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:3px;color:#5B6376}
.seg button.on{background:var(--gb3);color:#fff}
.seg button:not(.on):hover{background:var(--gb0)}

.st{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap;line-height:1.4}
.st.or{color:var(--or);background:var(--or-bg);border-color:#F3B98A}
.st.rd{color:var(--rd);background:var(--rd-bg);border-color:#F1A2A4}
.st.gr{color:var(--gr);background:var(--gr-bg);border-color:#93D4B4}
.st.bl{color:var(--bl);background:var(--bl-bg);border-color:#AFC0E4}
.st.gy{color:#6C7385;background:#EEF0F4;border-color:#D3D8E2}
.st.yl{color:#6D6200;background:var(--lemon);border-color:var(--lemon2)}
.st.bk{color:#fff;background:var(--ink);border-color:var(--ink)}

table.tb{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10.5px}
.tb th{font-weight:400;color:var(--mute);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tb td{padding:8px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb tr.click:hover td{background:#EFF1F7;cursor:pointer}
.tb .ic{color:var(--mute);margin-right:4px}

.btn{font-family:var(--mono);font-size:10.5px;padding:5px 10px;border-radius:4px;border:1px solid var(--line);background:var(--card2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--gb3)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:#2A365C}
.btn.yl{background:var(--lemon);border-color:var(--lemon2)}
.btn.ghost{border-color:transparent;background:none;color:var(--gb4)}
.btn.sm{padding:2px 7px;font-size:9.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.in{font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:#fff;border-radius:4px;padding:6px 8px;outline:none;width:100%}
.in:focus{border-color:var(--gb3)}
.lbl{font-family:var(--mono);font-size:10px;color:var(--mute);margin-bottom:4px;display:block}
.muted{color:var(--mute)}
.small{font-size:11px}
.xs{font-family:var(--mono);font-size:9.5px;color:var(--mute)}
.row{display:flex;align-items:center;gap:8px}
.row.w{flex-wrap:wrap}
.hr{height:1px;background:var(--line2);margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:3px;background:var(--gb0);color:var(--gb4);cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--gb)}
.chip.on{background:var(--gb3);color:#fff}
.chip.old{background:#EEE8D9;color:#8A6D2F}
.hl{background:var(--lemon);padding:0 2px}
.warn{background:#FFF7E0;border:1px dashed #E9C25B;border-radius:6px;padding:8px 10px;font-size:11.5px}
.err{background:var(--rd-bg);border:1px dashed #F1A2A4;border-radius:6px;padding:8px 10px;font-size:11.5px}
.scroll{overflow:auto}

/* hero */
.hero .dt{font-family:var(--mono);font-size:10px;color:var(--mute)}
.hero .live{font-family:var(--mono);font-size:10.5px;color:var(--mute2);margin-top:8px;display:flex;align-items:center;gap:6px}
.hero .live i{width:6px;height:6px;border-radius:50%;background:#E9D94A;box-shadow:0 0 0 3px #FBF4B9}
.hero h1{font-weight:500;font-size:30px;letter-spacing:-.01em;margin:22px 0 10px;display:flex;align-items:center;gap:14px}
.hero h1 .ar{color:var(--gb);font-weight:300}
.hero .ln{font-family:var(--mono);font-size:10.5px;color:var(--ink2);margin-top:5px;display:flex;gap:10px;align-items:center}
.hero svg.ill{position:absolute;right:16px;bottom:10px}

/* heat */
.heat{display:grid;grid-template-columns:28px repeat(14,1fr);gap:3px;align-items:end;margin-top:6px}
.heat .y{font-family:var(--mono);font-size:8.5px;color:var(--mute2);height:18px;display:flex;align-items:center}
.heat .cell{height:18px;border-radius:1.5px;position:relative}
.heat .x{font-family:var(--mono);font-size:8.5px;color:var(--mute2);text-align:center;padding-top:4px}
.heat .tag{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:8px;color:#fff;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-family:var(--mono);font-size:9px;color:var(--mute)}
.legend i{display:inline-block;width:7px;height:7px;margin-right:5px;vertical-align:-1px}

/* feed */
.feed{font-family:var(--mono);font-size:10px;line-height:1.5;height:196px;overflow:hidden;background:#EEF0F6;border-radius:5px;padding:8px 10px;position:relative}
.feed .l{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed #DEE2EB;animation:fi .5s ease}
.feed .l .tm{color:var(--mute2)}
@keyframes fi{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
.mapdots{position:absolute;inset:0;pointer-events:none;opacity:.5}

/* people */
.ppl{display:flex;flex-direction:column;gap:2px;max-height:196px;overflow:auto}
.pp{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:5px}
.pp:hover{background:#EEF0F6}
.pp .a{width:30px;height:30px;border-radius:5px;background:var(--gb);display:grid;place-items:center;font-weight:600;color:var(--navy);font-size:12px;position:relative}
.pp .a i{position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:50%;border:2px solid var(--card)}
.pp .r{font-family:var(--mono);font-size:9px;color:var(--gb4)}
.pp .n{font-size:11.5px}
.pp .dots{margin-left:auto;color:var(--mute)}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;height:62px;background:linear-gradient(to top,var(--bg) 70%,rgba(240,241,246,0));display:flex;align-items:center;justify-content:center;z-index:20}
.tabs{display:flex;gap:30px}
.tabs a{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:#B6BDCC;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:7px;padding-top:6px}
.tabs a span.cn{font-size:9px;letter-spacing:.05em}
.tabs a::after{content:"";width:46px;height:2px;background:#CDD3DF;border-radius:2px}
.tabs a.on{color:var(--ink)}
.tabs a.on::after{background:var(--ink);height:3px;width:20px}
.corner{position:fixed;left:22px;bottom:14px;display:flex;flex-direction:column;gap:5px;z-index:21}
.nv{background:var(--navy);color:#fff;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:3px 8px;border-radius:2px;display:inline-flex;gap:6px;align-items:center}
.nv:hover{background:#2E3A63}
.demo-note{position:fixed;right:22px;bottom:18px;font-family:var(--mono);font-size:9px;color:var(--mute2);z-index:21}

/* triage / reading */
.qitem{display:flex;gap:8px;padding:9px 8px;border-radius:6px;border:1px solid transparent;cursor:pointer}
.qitem:hover{background:#EEF0F6}
.qitem.on{background:#fff;border-color:var(--gb)}
.qitem .tt{font-size:12px;line-height:1.35}
.qitem .mt{font-family:var(--mono);font-size:9.5px;color:var(--mute);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line2);border-radius:6px;margin-bottom:8px;cursor:pointer;background:#fff;overflow:hidden}
.pair:hover{border-color:var(--gb2)}
.pair.on{border-color:var(--gb4);box-shadow:0 0 0 2px var(--gb0)}
.pair>div{padding:10px 12px;font-size:12.5px;line-height:1.65}
.pair>div:first-child{border-right:1px solid var(--line2);color:var(--ink2)}
.pair .pn{font-family:var(--mono);font-size:9px;color:var(--mute2);display:flex;gap:6px;align-items:center;margin-bottom:4px}
.pair.bad>div:last-child{background:#FFF6F6}

/* writing */
.stepper{display:flex;gap:0;align-items:center;font-family:var(--mono);font-size:10.5px;flex-wrap:wrap}
.stepper .s{display:flex;align-items:center;gap:6px;color:var(--mute2);padding:4px 0}
.stepper .s i{width:18px;height:18px;border-radius:50%;border:1px solid var(--gb);display:grid;place-items:center;font-style:normal;font-size:9px}
.stepper .s.done{color:var(--ink2)} .stepper .s.done i{background:var(--gb3);border-color:var(--gb3);color:#fff}
.stepper .s.cur{color:var(--ink)} .stepper .s.cur i{background:var(--lemon);border-color:#D9C94B;color:var(--ink)}
.stepper .bar{width:34px;height:1px;background:var(--gb);margin:0 10px}
.sec{background:#fff;border:1px solid var(--line2);border-radius:6px;padding:12px 14px;margin-bottom:8px}
.sec.gap{border-color:#E9C25B;background:#FFFDF2}
.sec h4{margin:0 0 6px;font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.sec h4 .n{font-family:var(--mono);font-size:10px;color:var(--mute)}
.sec ul{margin:4px 0 8px;padding-left:18px;font-size:12px;line-height:1.7;color:var(--ink2)}
.para{position:relative;font-size:13.5px;line-height:1.85;padding:8px 12px;border-radius:6px;border:1px solid transparent;margin:0 -12px}
.para:hover{background:#fff;border-color:var(--line2)}
.para.lock{background:#F6F8FD}
.para.ret{background:#FFF6F6;border-color:#F1A2A4}
.para .acts{position:absolute;right:6px;top:-12px;display:none;gap:4px}
.para:hover .acts{display:flex}
.cite{font-family:var(--mono);font-size:9.5px;color:var(--bl);background:var(--bl-bg);border-radius:3px;padding:0 4px;cursor:pointer;margin:0 1px;white-space:nowrap}
.cite:hover{background:var(--gb)}
.unv{background:linear-gradient(transparent 55%,#FBE7A6 55%);cursor:help}
.doc h2{font-size:15px;font-weight:600;margin:18px 0 6px}
.doc h1{font-size:21px;font-weight:600;margin:4px 0 4px}
.caret::after{content:"▍";animation:bl 1s infinite;color:var(--gb4)}
@keyframes bl{50%{opacity:0}}

.ckr{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line2);align-items:start}
.ckr:last-child{border-bottom:0}
.ckr .ico{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-family:var(--mono)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cmp>div{background:#fff;border:1px solid var(--line2);border-radius:5px;padding:8px;font-size:11.5px;line-height:1.55}
.ver{display:flex;gap:10px;padding:7px 0;font-family:var(--mono);font-size:10px;border-bottom:1px dashed var(--line2);align-items:center}
.ver:last-child{border-bottom:0}
.ver .d{width:8px;height:8px;border-radius:50%;background:var(--gb2);flex:none}

/* modal + toast */
.mask{position:fixed;inset:0;background:rgba(21,24,33,.28);display:none;align-items:center;justify-content:center;z-index:50}
.mask.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:10px;width:min(640px,92vw);max-height:84vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px rgba(28,37,65,.18)}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--navy);color:#fff;font-family:var(--mono);font-size:11px;padding:9px 14px;border-radius:6px;z-index:60;transition:.25s;max-width:90vw}
.toast.on{transform:translateX(-50%) translateY(0)}
.drawer{position:fixed;left:22px;bottom:70px;width:360px;max-width:calc(100vw - 44px);height:440px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 50px rgba(28,37,65,.18);z-index:40;display:none;flex-direction:column}
.drawer.on{display:flex}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{font-size:12px;line-height:1.6;padding:8px 10px;border-radius:7px;max-width:88%}
.m.me{align-self:flex-end;background:var(--navy);color:#fff}
.m.ai{background:#fff;border:1px solid var(--line2)}
.drop{border:1.5px dashed var(--gb2);border-radius:8px;padding:16px;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--mute);background:#F3F5FA;cursor:pointer}
.drop:hover{background:#EBEEF6}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-weight:500;font-size:22px;letter-spacing:-.01em}
.kpi span{font-family:var(--mono);font-size:9.5px;color:var(--mute)}
.bar{height:6px;border-radius:3px;background:var(--gb0);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gb3)}
.spin{display:inline-block;width:10px;height:10px;border:1.5px solid var(--gb2);border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:1100px){
  .g-ov,.g-src,.g-tri,.g-sea,.g-wr,.g-rv,.g-lib{grid-template-columns:1fr!important}
  .g-ov>*,.g-src>*,.g-tri>*,.g-sea>*,.g-wr>*,.g-rv>*,.g-lib>*{grid-column:auto!important;grid-row:auto!important}
  .search{display:none}
  .tabs{gap:12px;overflow:auto;padding:0 10px}
  .tabs a{font-size:9px}
  .tabs a::after{width:28px}
  .demo-note{display:none}
  .app{padding:12px 16px 110px}
  .corner{display:none}
  .hero svg.ill{display:none}
  .logo{font-size:16px}
  .user select{max-width:110px}
  .hero h1{font-size:24px}
}

/* 验收视图：需求编号默认隐藏 */
body:not(.acc) .fid{display:none}
.ch .fid{margin-left:6px}
.accbtn{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:3px;border:1px solid var(--gb1,#C2CADD);background:#fff;color:var(--ink)}
.accbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs a{font-family:var(--sans);font-size:12px;letter-spacing:.08em}
/* 单篇用时对比 */
.vcard{margin-bottom:12px}
.vgrid{display:grid;grid-template-columns:1fr 260px;gap:24px;align-items:center}
.vrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.vl{width:46px;font-size:11px;color:var(--mute)}
.vt{width:74px;text-align:right;font-family:var(--mono);font-size:11px}
.vbar{flex:1;display:flex;height:28px;border-radius:3px;overflow:hidden;gap:2px}
.vbar span{display:flex;flex-direction:column;justify-content:center;padding:0 8px;font-family:var(--mono);font-size:10px;white-space:nowrap;overflow:hidden;min-width:0}
.vbar span b{font-family:var(--sans);font-weight:500;font-size:10.5px}
.vb0{background:#E3E7F0}.vb1{background:#C2CADD}.vb2{background:#8796B5;color:#fff}
.vn0{background:var(--lemon)}.vn1{background:#F7E97A}.vn2{background:#151821;color:#fff}
.vkpi{border-left:1px dashed #C2CADD;padding-left:22px}
.vbig{font-size:34px;font-weight:400;letter-spacing:-.01em;line-height:1.1}
.vbig small{font-size:13px;color:var(--mute)}
@media (max-width:820px){.vgrid{grid-template-columns:1fr}.vkpi{border-left:0;padding-left:0;border-top:1px dashed #C2CADD;padding-top:12px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">研究写作台</div>
    <div class="sp"></div>
    <div class="search"><input id="gsearch" placeholder="搜索素材、稿件、来源…" onkeydown="if(event.key==='Enter'){S.q=this.value;go('search')}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div>
    <button class="ibtn" title="运行状态" onclick="openOps()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
    <button class="ibtn" title="通知" onclick="toast('3 条新通知：提纲待审 1 · 采集失败 1 · 退回段落 1')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button>
    <div class="user"><div class="av" id="uav">林</div>
      <select id="role" onchange="setRole(this.value)">

   <div class="acts">${review?(k.final?'':`<button class="btn sm" onclick="retPara(${i})">退回此段</button>`):(k.genDone?`<button class="btn sm" onclick="editPara(${i})">编辑</button>`:'')}</div></div>`}
 if(!review&&!k.genDone)h+=`<div class="caret xs" style="margin-top:6px">本地生成中 </div>`;
 h+='</div>';
 if(!review&&k.genDone)h+=`<div class="hr"></div><div class="row"><span class="xs" style="flex:1">矛盾或证据不足处已标记 <span class="unv">待核实</span> · 中断后保留已完成章节</span><button class="btn pri" onclick="submitReview()">提交复核 →</button></div>`;

const CHECKS=[

 {id:'c2',ref:'M-0401§2 ↔ M-0409§1',p:'注册参会人数',k:'conflict',d:'两处来源数字不同：4.2 万 vs 4.6 万'},
 {id:'c3',ref:'M-0412§1',p:'适应资金"增至三倍"',k:'ok',d:'可定位 · 译文已修订 v2',},

 const k=S.task;

 const allOk=CHECKS.every(c=>k.cite[c.id]&&k.cite[c.id]!=='退回');const anyRet=Object.keys(k.ret).length>0;
 const ck=CHECKS.map(c=>{const s=k.cite[c.id];const ic=s==='确认'?['✓','var(--gr-bg)','var(--gr)']:s==='删去'?['–','#EEF0F4','#6C7385']:s==='退回'?['!','var(--rd-bg)','var(--rd)']:c.k==='ok'||c.k==='time'?['·','var(--bl-bg)','var(--bl)']:['!','var(--or-bg)','var(--or)'];
  return `<div class="ckr"><span class="ico" style="background:${ic[1]};color:${ic[2]}">${ic[0]}</span><div><div class="row"><span class="cite" onclick="showEv('${c.ref.split('§')[0]}')">${c.ref}</span><span class="small">${c.p}</span></div><div class="xs" style="margin-top:3px">${c.d}</div>
  ${c.k==='conflict'?`<div class="cmp"><div><span class="xs">UNFCCC 新闻室 · 11-23 10:05</span><br>注册参会人数已超过 <b>4.2 万</b>人</div><div><span class="xs">阿纳多卢通讯社 · 11-23 14:20</span><br>注册参会人数已超过 <b>4.6 万</b>人</div></div>`:''}
  ${c.k==='dead'?`<div class="warn" style="margin-top:6px">原网址失效，显示留存快照；可确认或要求补证</div>`:''}
  ${s?`<div class="xs" style="margin-top:4px">${s} · 陈审核 · 刚刚</div>`:''}</div>
  <div class="row" style="gap:4px;align-self:center">${k.final?'':`<button class="btn sm" onclick="cite('${c.id}','确认')">确认</button><button class="btn sm" onclick="cite('${c.id}','退回')">退回</button>${c.k==='conflict'?`<button class="btn sm" onclick="cite('${c.id}','删去')">删去论断</button>`:''}`}</div></div>`}).join('');
 const done=CHECKS.filter(c=>k.cite[c.id]).length;
 const ckc=card('引用检查','F12',`<div class="row" style="margin-bottom:6px"><div class="bar" style="flex:1"><i style="width:${done/CHECKS.length*100}%"></i></div><span class="xs">${done}/${CHECKS.length}</span></div><div class="xs" style="margin-bottom:4px">模型自评不能代替人工确认事实 · 每项操作留痕</div>${ck}`);
 const vers=[...k.olHist.map(v=>['gb2',v]),...(k.final?[['gr','终稿 v'+k.draftVer+' · 批准 · 陈审核']]:[])];
 const vc=card('版本','F13',vers.map(v=>`<div class="ver"><span class="d" style="background:var(--${v[0]})"></span>${esc(v[1])}</div>`).join('')+`<div class="xs" style="margin-top:8px">再次修改已审内容须重审 · 多人同时修改时提示冲突</div>`);
 const ex=`${k.final?`<div class="row" style="margin-bottom:8px">${st('终稿已批')}<span class="xs">v${k.draftVer} · 陈审核</span></div>`:`<div class="xs" style="margin-bottom:8px">${anyRet?'有退回段落，待编辑修改后重送':allOk?'引用已全部处理，可批准终稿':'完成引用检查后可批准终稿'}</div>`}
  ${k.final?'':`<button class="btn pri" ${(!allOk||anyRet)?'disabled':''} onclick="approveFinal()">批准为终稿 v${k.draftVer}</button>`}
  ${anyRet&&S.role==='编辑'?`<button class="btn yl" style="margin-left:6px" onclick="resubmit()">修改完成，重新提交</button>`:''}
  <div class="hr"></div><span class="lbl">导出 Word · 模板「周综述 v3」</span>
  <button class="btn ${k.final?'pri':''}" ${k.final?'':'disabled'} onclick="exportDoc()">⇩ 导出 .doc</button>
  <div class="xs" style="margin-top:6px">只允许导出最终批准版 · 含标题层级、页码、来源说明</div>
  ${k.exported.map(e=>`<div class="ver"><span class="d" style="background:var(--gr)"></span>${e}</div>`).join('')}
  ${k.final?`<div class="hr"></div><button class="btn" onclick="go('library')">沉淀为范稿 →</button>`:''}`;
 const exc=card('审批与导出','F13 · F15',ex);
 return `<div class="grid g-rv" style="grid-template-columns:1.25fr 1fr .62fr;align-items:start"><section class="card"><div class="ch"><span class="t">稿件 · ${k.final?'终稿':'待审 v'+k.draftVer}</span><span class="sp"></span><span class="xs">悬停段落可退回</span></div>${draftView(true)}</section>${ckc}<div>${exc}<div style="height:12px"></div>${vc}</div></div>`;
}

 DRAFT.forEach((d,i)=>{if(d.h)body+=`<h2>${d.h}</h2>`;else body+=`<p>${(k.paras[i]||d.p).replace(/<[^>]+>/g,'')}<sup>[${d.c.join('; ')}]</sup></p>`});
